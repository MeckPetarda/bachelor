# chrony.conf — Lighthouse Attendance System NTP Server
#
# This server provides NTP time to ESP32 lighthouse devices on the LAN.
# The server uses chrony, which works correctly even when the server itself
# is intermittently connected to the internet or has no upstream NTP access.
#
# Reference: https://chrony-project.org/doc/4.5/chrony.conf.html

# ─── Upstream time sources ───────────────────────────────────────────────────
# Use public NTP pool servers when internet is available.
# chrony will fall back to local stratum mode if none are reachable.
pool 2.pool.ntp.org iburst maxsources 4

# ─── Local-only fallback ─────────────────────────────────────────────────────
# Serve time to LAN devices even when no upstream NTP source is reachable.
# Stratum 10 signals "local reference only" to any client that cares.
# This is critical for LAN-only deployments without internet access.
local stratum 10

# ─── Allow LAN clients ───────────────────────────────────────────────────────
# Permit NTP queries from any device on private RFC-1918 address ranges.
# Adjust to match the actual subnet(s) used in your deployment.
allow 192.168.0.0/16
allow 10.0.0.0/8
allow 172.16.0.0/12

# ─── Clock stepping ──────────────────────────────────────────────────────────
# Allow large time steps for the first 3 clock updates after server startup.
# This prevents chrony from slewing slowly through a large offset on reboot.
makestep 1.0 3

# ─── Drift file ──────────────────────────────────────────────────────────────
# Persist measured clock drift so chrony can apply corrections immediately
# after a restart without waiting for a new set of measurements.
driftfile /var/lib/chrony/drift

# ─── Real-time clock synchronisation ─────────────────────────────────────────
# Update the hardware RTC (if present) when the system clock is adjusted.
rtcsync

# ─── Logging ─────────────────────────────────────────────────────────────────
logdir /var/log/chrony
log measurements statistics tracking
