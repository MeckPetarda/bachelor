<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif" font-size="12">
  <rect width="700" height="420" fill="#fff"/>
  <text x="350" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">RSSI Trend — Algorithm 2 (IN traversal example)</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#374151"/>
    </marker>
  </defs>

  <!-- ── OUTSIDE PANEL (left) ── -->
  <text x="175" y="50" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">Outside Lighthouse (LH-A)</text>
  <text x="175" y="65" text-anchor="middle" font-size="10" fill="#64748b">Person departing → signal weakens</text>

  <!-- Axes -->
  <line x1="60" y1="240" x2="300" y2="240" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="60" y1="80" x2="60" y2="245" stroke="#374151" stroke-width="1.5"/>
  <text x="285" y="256" font-size="10" fill="#374151">time →</text>
  <text x="30" y="165" font-size="10" fill="#374151" text-anchor="middle" transform="rotate(-90,30,165)">RSSI (dBm)</text>

  <!-- Y axis labels -->
  <text x="56" y="95" text-anchor="end" font-size="9" fill="#64748b">-50</text>
  <text x="56" y="135" text-anchor="end" font-size="9" fill="#64748b">-60</text>
  <text x="56" y="175" text-anchor="end" font-size="9" fill="#64748b">-70</text>
  <text x="56" y="215" text-anchor="end" font-size="9" fill="#64748b">-80</text>
  <line x1="58" y1="93" x2="62" y2="93" stroke="#374151" stroke-width="1"/>
  <line x1="58" y1="133" x2="62" y2="133" stroke="#374151" stroke-width="1"/>
  <line x1="58" y1="173" x2="62" y2="173" stroke="#374151" stroke-width="1"/>
  <line x1="58" y1="213" x2="62" y2="213" stroke="#374151" stroke-width="1"/>

  <!-- Outside scatter data points (signal starts strong, falls off) -->
  <circle cx="80"  cy="105" r="4" fill="#1d4ed8" opacity="0.8"/>
  <circle cx="100" cy="112" r="4" fill="#1d4ed8" opacity="0.8"/>
  <circle cx="115" cy="118" r="4" fill="#1d4ed8" opacity="0.8"/>
  <circle cx="135" cy="130" r="4" fill="#1d4ed8" opacity="0.8"/>
  <circle cx="155" cy="140" r="4" fill="#1d4ed8" opacity="0.8"/>
  <circle cx="170" cy="153" r="4" fill="#1d4ed8" opacity="0.8"/>
  <circle cx="185" cy="160" r="4" fill="#1d4ed8" opacity="0.8"/>
  <circle cx="205" cy="172" r="4" fill="#1d4ed8" opacity="0.8"/>
  <circle cx="220" cy="185" r="4" fill="#1d4ed8" opacity="0.8"/>
  <circle cx="240" cy="195" r="4" fill="#1d4ed8" opacity="0.8"/>
  <circle cx="260" cy="205" r="4" fill="#1d4ed8" opacity="0.8"/>
  <circle cx="278" cy="218" r="4" fill="#1d4ed8" opacity="0.8"/>

  <!-- Outside regression line (negative slope) -->
  <line x1="75" y1="100" x2="283" y2="222" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="8,4"/>

  <!-- Slope annotation -->
  <text x="175" y="230" text-anchor="middle" font-size="10" fill="#1d4ed8" font-style="italic">slope &lt; 0 ✓ (expected for IN)</text>

  <!-- ── INSIDE PANEL (right) ── -->
  <text x="525" y="50" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">Inside Lighthouse (LH-B)</text>
  <text x="525" y="65" text-anchor="middle" font-size="10" fill="#64748b">Person approaching → signal strengthens</text>

  <!-- Axes -->
  <line x1="410" y1="240" x2="650" y2="240" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="410" y1="80" x2="410" y2="245" stroke="#374151" stroke-width="1.5"/>
  <text x="635" y="256" font-size="10" fill="#374151">time →</text>
  <text x="382" y="165" font-size="10" fill="#374151" text-anchor="middle" transform="rotate(-90,382,165)">RSSI (dBm)</text>

  <!-- Y axis labels (same scale) -->
  <text x="406" y="95" text-anchor="end" font-size="9" fill="#64748b">-50</text>
  <text x="406" y="135" text-anchor="end" font-size="9" fill="#64748b">-60</text>
  <text x="406" y="175" text-anchor="end" font-size="9" fill="#64748b">-70</text>
  <text x="406" y="215" text-anchor="end" font-size="9" fill="#64748b">-80</text>
  <line x1="408" y1="93" x2="412" y2="93" stroke="#374151" stroke-width="1"/>
  <line x1="408" y1="133" x2="412" y2="133" stroke="#374151" stroke-width="1"/>
  <line x1="408" y1="173" x2="412" y2="173" stroke="#374151" stroke-width="1"/>
  <line x1="408" y1="213" x2="412" y2="213" stroke="#374151" stroke-width="1"/>

  <!-- Inside scatter data points (signal starts weak, rises) -->
  <circle cx="430" cy="218" r="4" fill="#15803d" opacity="0.8"/>
  <circle cx="448" cy="210" r="4" fill="#15803d" opacity="0.8"/>
  <circle cx="465" cy="202" r="4" fill="#15803d" opacity="0.8"/>
  <circle cx="482" cy="192" r="4" fill="#15803d" opacity="0.8"/>
  <circle cx="500" cy="180" r="4" fill="#15803d" opacity="0.8"/>
  <circle cx="516" cy="168" r="4" fill="#15803d" opacity="0.8"/>
  <circle cx="533" cy="158" r="4" fill="#15803d" opacity="0.8"/>
  <circle cx="550" cy="145" r="4" fill="#15803d" opacity="0.8"/>
  <circle cx="568" cy="133" r="4" fill="#15803d" opacity="0.8"/>
  <circle cx="584" cy="120" r="4" fill="#15803d" opacity="0.8"/>
  <circle cx="600" cy="110" r="4" fill="#15803d" opacity="0.8"/>
  <circle cx="620" cy="100" r="4" fill="#15803d" opacity="0.8"/>

  <!-- Inside regression line (positive slope) -->
  <line x1="425" y1="222" x2="625" y2="97" stroke="#15803d" stroke-width="2" stroke-dasharray="8,4"/>

  <!-- Slope annotation -->
  <text x="525" y="230" text-anchor="middle" font-size="10" fill="#15803d" font-style="italic">slope &gt; 0 ✓ (expected for IN)</text>

  <!-- RTCF annotation box -->
  <rect x="200" y="268" width="300" height="46" rx="4" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="350" y="284" text-anchor="middle" font-size="11" fill="#14532d" font-weight="bold">RSSI Trend Consistency Factor (RTCF)</text>
  <text x="350" y="300" text-anchor="middle" font-size="10" fill="#14532d">Both slopes agree with IN direction → RTCF = 1.0</text>
  <text x="350" y="312" text-anchor="middle" font-size="10" fill="#14532d">C₂ = CSF_w × CSzF × BCF × RTCF</text>

  <!-- Divider between panels -->
  <line x1="350" y1="75" x2="350" y2="260" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Legend -->
  <rect x="140" y="330" width="420" height="24" rx="3" fill="#f1f5f9" stroke="#d1d5db" stroke-width="1"/>
  <circle cx="160" cy="342" r="4" fill="#1d4ed8"/>
  <text x="170" y="346" font-size="10" fill="#374151">Outside scans</text>
  <circle cx="280" cy="342" r="4" fill="#15803d"/>
  <text x="290" y="346" font-size="10" fill="#374151">Inside scans</text>
  <line x1="375" y1="342" x2="395" y2="342" stroke="#374151" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="400" y="346" font-size="10" fill="#374151">Linear regression trend</text>

</svg>
