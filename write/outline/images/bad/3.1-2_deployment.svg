<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif" font-size="13">

  <!-- Background -->
  <rect width="700" height="420" fill="#ffffff"/>

  <!-- Title -->
  <text x="350" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Physical Deployment — Detection Portal at a Doorway</text>

  <!-- Floor plan outline (top-down) -->
  <!-- Left wall -->
  <rect x="60" y="60" width="20" height="300" fill="#ccc" stroke="#888" stroke-width="1"/>
  <!-- Right wall -->
  <rect x="620" y="60" width="20" height="300" fill="#ccc" stroke="#888" stroke-width="1"/>
  <!-- Top wall left segment -->
  <rect x="60" y="60" width="180" height="20" fill="#ccc" stroke="#888" stroke-width="1"/>
  <!-- Top wall right segment -->
  <rect x="460" y="60" width="180" height="20" fill="#ccc" stroke="#888" stroke-width="1"/>
  <!-- Bottom wall left segment -->
  <rect x="60" y="340" width="180" height="20" fill="#ccc" stroke="#888" stroke-width="1"/>
  <!-- Bottom wall right segment -->
  <rect x="460" y="340" width="180" height="20" fill="#ccc" stroke="#888" stroke-width="1"/>

  <!-- Door opening markers (small diagonal lines at jambs) -->
  <line x1="240" y1="60" x2="240" y2="80" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="460" y1="60" x2="460" y2="80" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="240" y1="340" x2="240" y2="360" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="460" y1="340" x2="460" y2="360" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Doorway gap label -->
  <line x1="240" y1="52" x2="460" y2="52" stroke="#555" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="350" y="48" text-anchor="middle" font-size="11" fill="#555">Doorway opening (~90 cm)</text>

  <!-- Zone fills -->
  <!-- Outside zone (left) -->
  <rect x="80" y="80" width="160" height="260" fill="#dbeafe" fill-opacity="0.5"/>
  <text x="160" y="218" text-anchor="middle" font-size="12" fill="#1d4ed8" font-style="italic">OUTSIDE</text>

  <!-- Inside zone (right) -->
  <rect x="460" y="80" width="160" height="260" fill="#dcfce7" fill-opacity="0.5"/>
  <text x="540" y="218" text-anchor="middle" font-size="12" fill="#15803d" font-style="italic">INSIDE</text>

  <!-- Corridor / doorway zone -->
  <rect x="240" y="80" width="220" height="260" fill="#f9fafb"/>

  <!-- Detection zone ellipses -->
  <!-- Outside Lighthouse detection zone -->
  <ellipse cx="200" cy="210" rx="130" ry="90" fill="none" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <!-- Inside Lighthouse detection zone -->
  <ellipse cx="500" cy="210" rx="130" ry="90" fill="none" stroke="#15803d" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Lighthouse A (outside) — box on top wall -->
  <rect x="147" y="68" width="46" height="24" rx="3" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="170" y="84" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">LH-A</text>

  <!-- Lighthouse B (inside) — box on top wall -->
  <rect x="507" y="68" width="46" height="24" rx="3" fill="#15803d" stroke="#14532d" stroke-width="1.5"/>
  <text x="530" y="84" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">LH-B</text>

  <!-- Person figure mid-traversal (simple stick figure, top-down oval) -->
  <ellipse cx="350" cy="200" rx="12" ry="18" fill="#6b7280" stroke="#374151" stroke-width="1.5"/>
  <!-- Movement arrow -->
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#374151"/>
    </marker>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#555"/>
    </marker>
    <marker id="arrR" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto-start-reverse">
      <polygon points="0 0, 6 3, 0 6" fill="#555"/>
    </marker>
  </defs>
  <line x1="295" y1="200" x2="332" y2="200" stroke="#374151" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="310" y="193" text-anchor="middle" font-size="10" fill="#374151">traversal</text>

  <!-- MQTT arrows pointing up from each LH to a cloud/server label -->
  <line x1="170" y1="68" x2="170" y2="46" stroke="#6366f1" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#mqttarrow)"/>
  <line x1="530" y1="68" x2="530" y2="46" stroke="#6366f1" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#mqttarrow)"/>
  <defs>
    <marker id="mqttarrow" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#6366f1"/>
    </marker>
  </defs>

  <!-- Server box at top centre -->
  <rect x="298" y="30" width="104" height="22" rx="3" fill="#6366f1" stroke="#4338ca" stroke-width="1.5"/>
  <text x="350" y="45" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Server (MQTT)</text>

  <!-- Legend -->
  <rect x="60" y="375" width="580" height="36" rx="3" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <rect x="75" y="387" width="14" height="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
  <text x="95" y="396" font-size="11" fill="#374151">Outside zone</text>
  <rect x="175" y="387" width="14" height="10" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
  <text x="195" y="396" font-size="11" fill="#374151">Inside zone</text>
  <line x1="270" y1="392" x2="290" y2="392" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="295" y="396" font-size="11" fill="#374151">UHF detection range (~2–3 m radius)</text>
  <rect x="470" y="387" width="14" height="10" rx="2" fill="#1d4ed8"/>
  <text x="490" y="396" font-size="11" fill="#374151">LH-A / LH-B = Lighthouse units</text>

</svg>
