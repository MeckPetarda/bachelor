<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif" font-size="12">
  <rect width="640" height="340" fill="#fff"/>
  <text x="320" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">User and Tag Data Model</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#374151"/>
    </marker>
    <marker id="diamond" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <polygon points="4,0 8,4 4,8 0,4" fill="#374151"/>
    </marker>
  </defs>

  <!-- ── users table ── -->
  <rect x="60" y="55" width="180" height="170" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <!-- Header -->
  <rect x="60" y="55" width="180" height="28" rx="4" fill="#1d4ed8"/>
  <text x="150" y="74" text-anchor="middle" fill="#fff" font-weight="bold" font-size="13">users</text>
  <!-- Fields -->
  <text x="75" y="105" fill="#1e3a8a" font-size="11">🔑  id  (UUID, PK)</text>
  <text x="75" y="123" fill="#1e3a8a" font-size="11">    syncId  (int, nullable)</text>
  <text x="75" y="141" fill="#1e3a8a" font-size="11">    name  (varchar, nullable)</text>
  <text x="75" y="159" fill="#1e3a8a" font-size="11">    email  (varchar, nullable)</text>
  <text x="75" y="177" fill="#64748b" font-size="10" font-style="italic">Display falls back to last 5</text>
  <text x="75" y="191" fill="#64748b" font-size="10" font-style="italic">chars of oldest EPC if null</text>
  <text x="75" y="209" fill="#64748b" font-size="10" font-style="italic">syncId = Navigo3 user ID</text>

  <!-- ── userTagAssignments table ── -->
  <rect x="230" y="55" width="180" height="170" rx="4" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <rect x="230" y="55" width="180" height="28" rx="4" fill="#15803d"/>
  <text x="320" y="74" text-anchor="middle" fill="#fff" font-weight="bold" font-size="11">userTagAssignments</text>
  <text x="245" y="105" fill="#14532d" font-size="11">🔑  id  (bigint, PK)</text>
  <text x="245" y="123" fill="#14532d" font-size="11">🔗  userId  (UUID, FK → users)</text>
  <text x="245" y="141" fill="#14532d" font-size="11">🔗  epc  (varchar, FK → tags)</text>
  <text x="245" y="159" fill="#14532d" font-size="11">    assignedAt  (timestamptz)</text>
  <text x="245" y="177" fill="#14532d" font-size="11">    revokedAt  (timestamptz, null)</text>
  <text x="245" y="200" fill="#64748b" font-size="10" font-style="italic">Active assignment:</text>
  <text x="245" y="213" fill="#64748b" font-size="10" font-style="italic">revokedAt IS NULL</text>

  <!-- ── tags table ── -->
  <rect x="400" y="55" width="180" height="130" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <rect x="400" y="55" width="180" height="28" rx="4" fill="#d97706"/>
  <text x="490" y="74" text-anchor="middle" fill="#fff" font-weight="bold" font-size="13">tags</text>
  <text x="415" y="105" fill="#78350f" font-size="11">🔑  epc  (varchar, PK)</text>
  <text x="415" y="123" fill="#78350f" font-size="11">    label  (varchar, nullable)</text>
  <text x="415" y="141" fill="#64748b" font-size="10" font-style="italic">EPC = UHF Gen2 tag ID</text>
  <text x="415" y="155" fill="#64748b" font-size="10" font-style="italic">Auto-created on first scan</text>

  <!-- Relationship lines -->
  <!-- users ─< userTagAssignments -->
  <line x1="240" y1="141" x2="230" y2="141" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>
  <!-- Crow's foot notation: 1 end at users -->
  <line x1="240" y1="136" x2="240" y2="146" stroke="#374151" stroke-width="1.5"/>

  <!-- tags ─< userTagAssignments -->
  <line x1="410" y1="141" x2="410" y2="141"/>
  <line x1="410" y1="141" x2="410" y2="141"/>
  <line x1="400" y1="103" x2="390" y2="103" stroke="#374151" stroke-width="1.8"/>
  <line x1="390" y1="103" x2="390" y2="141" stroke="#374151" stroke-width="1.8"/>
  <line x1="390" y1="141" x2="410" y2="141" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>
  <!-- Crow's foot at tags end -->
  <line x1="400" y1="98" x2="400" y2="108" stroke="#374151" stroke-width="1.5"/>

  <!-- Cardinality labels -->
  <text x="213" y="135" text-anchor="end" font-size="10" fill="#374151">1</text>
  <text x="232" y="152" font-size="10" fill="#374151">N</text>
  <text x="395" y="96" text-anchor="end" font-size="10" fill="#374151">1</text>
  <text x="412" y="152" font-size="10" fill="#374151">N</text>

  <!-- Constraint note -->
  <rect x="150" y="250" width="340" height="60" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="320" y="268" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">Constraints</text>
  <text x="165" y="285" font-size="10" fill="#475569">• One active EPC per user at a time (enforced by unique index on userId where revokedAt IS NULL)</text>
  <text x="165" y="300" font-size="10" fill="#475569">• EPC can be reassigned to another user after revoking the current assignment</text>
  <text x="165" y="315" font-size="10" fill="#475569">• EPC cannot be shared between two active users simultaneously</text>

</svg>
