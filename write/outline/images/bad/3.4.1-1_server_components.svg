<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif" font-size="12">
  <rect width="700" height="420" fill="#fff"/>
  <text x="350" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Server — Internal Components and Message Flow</text>

  <defs>
    <marker id="a" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#374151"/></marker>
    <marker id="ag" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#15803d"/></marker>
    <marker id="ab" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#1d4ed8"/></marker>
    <marker id="ao" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#d97706"/></marker>
  </defs>

  <!-- ── COLUMN 1: External actors ── -->
  <!-- Firmware -->
  <rect x="20" y="60" width="110" height="40" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="75" y="78" text-anchor="middle" fill="#1e3a8a" font-weight="bold" font-size="11">Lighthouse</text>
  <text x="75" y="92" text-anchor="middle" fill="#1e3a8a" font-size="10">Firmware (×2)</text>

  <!-- Dashboard -->
  <rect x="20" y="220" width="110" height="40" rx="4" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="75" y="238" text-anchor="middle" fill="#14532d" font-weight="bold" font-size="11">Dashboard</text>
  <text x="75" y="252" text-anchor="middle" fill="#14532d" font-size="10">SolidJS SPA</text>

  <!-- Navigo3 -->
  <rect x="20" y="320" width="110" height="40" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="75" y="338" text-anchor="middle" fill="#78350f" font-weight="bold" font-size="11">Navigo3</text>
  <text x="75" y="352" text-anchor="middle" fill="#78350f" font-size="10">REST API</text>

  <!-- ── SERVER BOUNDARY ── -->
  <rect x="155" y="44" width="415" height="360" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7,3"/>
  <text x="363" y="60" text-anchor="middle" font-size="10" fill="#94a3b8" font-style="italic">BunJS Process</text>

  <!-- ── COLUMN 2: Ingest path ── -->
  <!-- MQTT Broker -->
  <rect x="170" y="75" width="130" height="40" rx="4" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="235" y="93" text-anchor="middle" fill="#1e1b4b" font-weight="bold" font-size="11">MQTT Broker</text>
  <text x="235" y="107" text-anchor="middle" fill="#1e1b4b" font-size="9">Aedes (embedded)</text>

  <!-- Scan Handler -->
  <rect x="170" y="160" width="130" height="40" rx="4" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="235" y="178" text-anchor="middle" fill="#1e1b4b" font-weight="bold" font-size="11">Scan Handler</text>
  <text x="235" y="192" text-anchor="middle" fill="#1e1b4b" font-size="9">validation · insert</text>

  <!-- HTTP API -->
  <rect x="170" y="250" width="130" height="40" rx="4" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="235" y="268" text-anchor="middle" fill="#1e1b4b" font-weight="bold" font-size="11">HTTP API</text>
  <text x="235" y="282" text-anchor="middle" fill="#1e1b4b" font-size="9">Hono · REST · JWT</text>

  <!-- WebSocket Gateway -->
  <rect x="170" y="340" width="130" height="40" rx="4" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="235" y="358" text-anchor="middle" fill="#1e1b4b" font-weight="bold" font-size="11">WebSocket Gateway</text>
  <text x="235" y="372" text-anchor="middle" fill="#1e1b4b" font-size="9">real-time push</text>

  <!-- ── COLUMN 3: Processing ── -->
  <!-- PostgreSQL -->
  <rect x="385" y="115" width="130" height="40" rx="4" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
  <text x="450" y="133" text-anchor="middle" fill="#78350f" font-weight="bold" font-size="11">PostgreSQL</text>
  <text x="450" y="147" text-anchor="middle" fill="#78350f" font-size="9">Drizzle ORM</text>

  <!-- Event Sweeper -->
  <rect x="385" y="215" width="130" height="40" rx="4" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="450" y="233" text-anchor="middle" fill="#1e1b4b" font-weight="bold" font-size="11">Event Sweeper</text>
  <text x="450" y="247" text-anchor="middle" fill="#1e1b4b" font-size="9">2 s interval poller</text>

  <!-- Navigo3 Poller -->
  <rect x="385" y="315" width="130" height="40" rx="4" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="450" y="333" text-anchor="middle" fill="#1e1b4b" font-weight="bold" font-size="11">Navigo3 Poller</text>
  <text x="450" y="347" text-anchor="middle" fill="#1e1b4b" font-size="9">60 s retry sweep</text>

  <!-- ── ARROWS ── -->

  <!-- Firmware → MQTT Broker (MQTT) -->
  <line x1="130" y1="80" x2="170" y2="90" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#ab)"/>
  <text x="148" y="78" text-anchor="middle" font-size="9" fill="#1d4ed8">MQTT</text>

  <!-- MQTT Broker → Scan Handler -->
  <line x1="235" y1="115" x2="235" y2="160" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="247" y="142" font-size="9" fill="#374151">onPublish</text>

  <!-- Scan Handler → PostgreSQL -->
  <line x1="300" y1="180" x2="385" y2="135" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="348" y="168" text-anchor="middle" font-size="9" fill="#374151">INSERT</text>

  <!-- Scan Handler → WebSocket (broadcast scan) -->
  <line x1="235" y1="200" x2="235" y2="340" stroke="#374151" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#a)"/>
  <text x="247" y="276" font-size="9" fill="#374151">scan</text>
  <text x="247" y="287" font-size="9" fill="#374151">event</text>

  <!-- Dashboard ↔ HTTP API -->
  <line x1="130" y1="234" x2="170" y2="265" stroke="#15803d" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="144" y="244" text-anchor="middle" font-size="9" fill="#15803d">REST</text>

  <!-- Dashboard ↔ WebSocket -->
  <line x1="130" y1="248" x2="170" y2="356" stroke="#15803d" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#ag)"/>
  <text x="138" y="308" font-size="9" fill="#15803d">WS</text>

  <!-- HTTP API → PostgreSQL -->
  <line x1="300" y1="270" x2="385" y2="135" stroke="#374151" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#a)"/>

  <!-- Event Sweeper ↔ PostgreSQL -->
  <line x1="450" y1="215" x2="450" y2="155" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="462" y="188" font-size="9" fill="#374151">read/write</text>

  <!-- Event Sweeper → WebSocket (event:new) -->
  <line x1="385" y1="240" x2="300" y2="356" stroke="#374151" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#a)"/>
  <text x="335" y="308" text-anchor="middle" font-size="9" fill="#374151">event:new</text>

  <!-- Navigo3 Poller → PostgreSQL -->
  <line x1="450" y1="315" x2="450" y2="155" stroke="#374151" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#a)"/>

  <!-- Navigo3 Poller → Navigo3 external -->
  <line x1="515" y1="335" x2="580" y2="338" stroke="#d97706" stroke-width="1.5"/>
  <line x1="580" y1="338" x2="580" y2="380" stroke="#d97706" stroke-width="1.5"/>
  <line x1="580" y1="380" x2="130" y2="340" stroke="#d97706" stroke-width="1.5" marker-end="url(#ao)"/>
  <text x="565" y="332" text-anchor="middle" font-size="9" fill="#d97706">REST</text>

</svg>
