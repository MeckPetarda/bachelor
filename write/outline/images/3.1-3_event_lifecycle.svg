<svg viewBox="0 0 780 580" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif" font-size="12">
  <rect width="780" height="580" fill="#fff"/>
  <text x="390" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Event Lifecycle — Tag Detection to Attendance Record</text>

  <defs>
    <marker id="a" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#374151"/></marker>
    <marker id="ar" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#b91c1c"/></marker>
    <marker id="ag" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#15803d"/></marker>
    <marker id="ao" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#d97706"/></marker>
  </defs>

  <!-- ── MAIN PATH (centre column) ── -->

  <!-- 1 IR sensor -->
  <rect x="265" y="44" width="220" height="34" rx="4" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="375" y="65" text-anchor="middle" fill="#0c4a6e" font-weight="bold">IR sensor detects motion</text>
  <line x1="375" y1="78" x2="375" y2="100" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 2 Scan window -->
  <rect x="265" y="100" width="220" height="38" rx="4" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="375" y="118" text-anchor="middle" fill="#0c4a6e" font-weight="bold">5 s RFID scan window</text>
  <text x="375" y="131" text-anchor="middle" fill="#0c4a6e" font-size="10">YPD-R300 real-time inventory</text>
  <line x1="375" y1="138" x2="375" y2="162" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 3 MQTT online? diamond -->
  <polygon points="375,162 445,190 375,218 305,190" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
  <text x="375" y="185" text-anchor="middle" fill="#78350f" font-weight="bold" font-size="11">MQTT</text>
  <text x="375" y="200" text-anchor="middle" fill="#78350f" font-weight="bold" font-size="11">online?</text>

  <!-- YES down -->
  <line x1="375" y1="218" x2="375" y2="240" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="385" y="233" font-size="10" fill="#374151">Yes</text>

  <!-- NO right → offline cache -->
  <line x1="445" y1="190" x2="530" y2="190" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="487" y="182" text-anchor="middle" font-size="10" fill="#b91c1c">No</text>

  <!-- 4 Batch publish -->
  <rect x="265" y="240" width="220" height="38" rx="4" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="375" y="258" text-anchor="middle" fill="#0c4a6e" font-weight="bold">Batch publish to MQTT</text>
  <text x="375" y="271" text-anchor="middle" fill="#0c4a6e" font-size="10">lighthouse/{id}/scans  QoS 1</text>
  <line x1="375" y1="278" x2="375" y2="300" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 5 raw_scans insert -->
  <rect x="265" y="300" width="220" height="38" rx="4" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="375" y="318" text-anchor="middle" fill="#0c4a6e" font-weight="bold">raw_scans inserted</text>
  <text x="375" y="331" text-anchor="middle" fill="#0c4a6e" font-size="10">timeBasis stored · processedAt = null</text>
  <line x1="375" y1="338" x2="375" y2="360" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 6 EventSweeper -->
  <rect x="265" y="360" width="220" height="38" rx="4" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="375" y="378" text-anchor="middle" fill="#0c4a6e" font-weight="bold">EventSweeper closes cluster</text>
  <text x="375" y="391" text-anchor="middle" fill="#0c4a6e" font-size="10">MAX(ts) &lt; NOW() − activityTimeoutMs</text>
  <line x1="375" y1="398" x2="375" y2="420" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 7 Algorithms -->
  <rect x="265" y="420" width="220" height="38" rx="4" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="375" y="438" text-anchor="middle" fill="#0c4a6e" font-weight="bold">Direction detection runs</text>
  <text x="375" y="451" text-anchor="middle" fill="#0c4a6e" font-size="10">Algorithm 1 + 2 → processed_events</text>
  <line x1="375" y1="458" x2="375" y2="480" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 8 Navigo3 push -->
  <rect x="265" y="480" width="220" height="38" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="375" y="498" text-anchor="middle" fill="#14532d" font-weight="bold">Push to Navigo3</text>
  <text x="375" y="511" text-anchor="middle" fill="#14532d" font-size="10">start / stop / upsert endpoint</text>

  <!-- ── OFFLINE BRANCH (right) ── -->

  <!-- Offline cache box -->
  <rect x="530" y="170" width="160" height="42" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="610" y="188" text-anchor="middle" fill="#7f1d1d" font-weight="bold" font-size="11">LittleFS ring buffer</text>
  <text x="610" y="203" text-anchor="middle" fill="#7f1d1d" font-size="10">event cached to flash</text>

  <!-- MQTT reconnects -->
  <rect x="530" y="244" width="160" height="34" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="610" y="261" text-anchor="middle" fill="#7f1d1d" font-weight="bold" font-size="11">MQTT reconnects</text>
  <text x="610" y="274" text-anchor="middle" fill="#7f1d1d" font-size="10">replay task starts</text>

  <line x1="610" y1="212" x2="610" y2="244" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Rejoin at raw_scans (step 5): line from reconnect box to step 5 -->
  <line x1="610" y1="278" x2="610" y2="319" stroke="#b91c1c" stroke-width="1.5"/>
  <line x1="610" y1="319" x2="485" y2="319" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="552" y="313" text-anchor="middle" font-size="9" fill="#b91c1c">replay (offline: true)</text>

  <!-- ── RETRY BRANCH (left) ── -->

  <!-- Push failed box -->
  <rect x="50" y="480" width="160" height="38" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="130" y="498" text-anchor="middle" fill="#78350f" font-weight="bold" font-size="11">Push failed</text>
  <text x="130" y="511" text-anchor="middle" fill="#78350f" font-size="10">syncedToIntegration = false</text>

  <!-- Arrow from step 8 left to fail box -->
  <line x1="265" y1="499" x2="210" y2="499" stroke="#d97706" stroke-width="1.5" marker-end="url(#ao)"/>
  <text x="240" y="492" text-anchor="middle" font-size="10" fill="#d97706">fail</text>

  <!-- Retry sweep box -->
  <rect x="50" y="395" width="160" height="38" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="130" y="413" text-anchor="middle" fill="#78350f" font-weight="bold" font-size="11">Retry sweep</text>
  <text x="130" y="426" text-anchor="middle" fill="#78350f" font-size="10">every 60 s · up to 100 events</text>

  <line x1="130" y1="480" x2="130" y2="433" stroke="#d97706" stroke-width="1.5" marker-end="url(#ao)"/>

  <!-- Retry re-enters at Navigo3 push -->
  <line x1="210" y1="414" x2="265" y2="493" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ao)"/>
  <text x="230" y="460" text-anchor="middle" font-size="9" fill="#d97706">retry push</text>

</svg>
