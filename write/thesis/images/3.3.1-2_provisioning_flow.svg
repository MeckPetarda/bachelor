<svg viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif" font-size="12">
  <rect width="680" height="520" fill="#fff"/>
  <text x="340" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">WiFi Provisioning — Captive Portal Flow</text>

  <defs>
    <marker id="a" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#374151"/></marker>
    <marker id="ab" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#1d4ed8"/></marker>
    <marker id="ag" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#15803d"/></marker>
    <marker id="ao" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#d97706"/></marker>
  </defs>

  <!-- Lane headers -->
  <rect x="30" y="44" width="180" height="26" rx="3" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="120" y="61" text-anchor="middle" fill="#1e1b4b" font-weight="bold">Lighthouse (ESP32)</text>
  <rect x="250" y="44" width="180" height="26" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="340" y="61" text-anchor="middle" fill="#14532d" font-weight="bold">User Device</text>
  <rect x="470" y="44" width="180" height="26" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="560" y="61" text-anchor="middle" fill="#78350f" font-weight="bold">NVS (Flash)</text>

  <!-- Lane dividers -->
  <line x1="240" y1="44" x2="240" y2="500" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="460" y1="44" x2="460" y2="500" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Step 1: BUTTON2 5s hold -->
  <rect x="40" y="90" width="170" height="34" rx="4" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="125" y="106" text-anchor="middle" fill="#1e1b4b" font-weight="bold" font-size="11">BUTTON2 held 5 s</text>
  <text x="125" y="118" text-anchor="middle" fill="#1e1b4b" font-size="9">Flag written to RTC memory</text>
  <line x1="125" y1="124" x2="125" y2="145" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Step 2: esp_restart -->
  <rect x="40" y="145" width="170" height="34" rx="4" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="125" y="161" text-anchor="middle" fill="#1e1b4b" font-weight="bold" font-size="11">esp_restart()</text>
  <text x="125" y="173" text-anchor="middle" fill="#1e1b4b" font-size="9">Boot detects flag → AP mode</text>
  <line x1="125" y1="179" x2="125" y2="200" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Step 3: AP + DNS + HTTP server -->
  <rect x="40" y="200" width="170" height="50" rx="4" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="125" y="216" text-anchor="middle" fill="#1e1b4b" font-weight="bold" font-size="11">AP "Lighthouse-Setup"</text>
  <text x="125" y="229" text-anchor="middle" fill="#1e1b4b" font-size="9">DNS: all queries → 192.168.4.1</text>
  <text x="125" y="242" text-anchor="middle" fill="#1e1b4b" font-size="9">HTTP server on port 80</text>

  <!-- User joins AP -->
  <line x1="210" y1="225" x2="250" y2="225" stroke="#15803d" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="230" y="218" text-anchor="middle" font-size="9" fill="#15803d">joins AP</text>

  <!-- Step 4: Captive portal detected -->
  <rect x="260" y="200" width="170" height="50" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="345" y="216" text-anchor="middle" fill="#14532d" font-weight="bold" font-size="11">Browser opens</text>
  <text x="345" y="229" text-anchor="middle" fill="#14532d" font-size="9">Captive portal detected</text>
  <text x="345" y="242" text-anchor="middle" fill="#14532d" font-size="9">iOS / Android / Windows</text>
  <line x1="345" y1="250" x2="345" y2="272" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Step 5: User fills form -->
  <rect x="260" y="272" width="170" height="50" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="345" y="288" text-anchor="middle" fill="#14532d" font-weight="bold" font-size="11">User fills form</text>
  <text x="345" y="301" text-anchor="middle" fill="#14532d" font-size="9">SSID · Password</text>
  <text x="345" y="313" text-anchor="middle" fill="#14532d" font-size="9">MQTT broker IP + Port</text>

  <!-- POST → ESP32 -->
  <line x1="260" y1="297" x2="210" y2="297" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="235" y="290" text-anchor="middle" font-size="9" fill="#374151">POST /configure</text>

  <!-- Step 6: ESP32 validates + responds -->
  <rect x="40" y="322" width="170" height="50" rx="4" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="125" y="338" text-anchor="middle" fill="#1e1b4b" font-weight="bold" font-size="11">Validate credentials</text>
  <text x="125" y="351" text-anchor="middle" fill="#1e1b4b" font-size="9">Test WiFi connection</text>
  <text x="125" y="363" text-anchor="middle" fill="#1e1b4b" font-size="9">Return JSON result</text>

  <!-- Save to NVS -->
  <line x1="210" y1="347" x2="470" y2="347" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ao)"/>
  <text x="340" y="340" text-anchor="middle" font-size="9" fill="#d97706">save credentials</text>

  <!-- NVS box -->
  <rect x="480" y="332" width="170" height="30" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="565" y="351" text-anchor="middle" fill="#78350f" font-weight="bold" font-size="10">Credentials stored</text>

  <line x1="125" y1="372" x2="125" y2="393" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Step 7: Reboot STA -->
  <rect x="40" y="393" width="170" height="34" rx="4" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="125" y="409" text-anchor="middle" fill="#1e1b4b" font-weight="bold" font-size="11">esp_restart()</text>
  <text x="125" y="421" text-anchor="middle" fill="#1e1b4b" font-size="9">No flag → STA mode</text>
  <line x1="125" y1="427" x2="125" y2="449" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Step 8: Normal boot -->
  <rect x="40" y="449" width="170" height="34" rx="16" fill="#15803d" stroke="#14532d" stroke-width="1.5"/>
  <text x="125" y="465" text-anchor="middle" fill="#fff" font-weight="bold" font-size="11">Normal Boot</text>
  <text x="125" y="477" text-anchor="middle" fill="#fff" font-size="9">Loads credentials from NVS</text>

</svg>
