<svg viewBox="0 0 660 400" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif" font-size="12">
  <rect width="660" height="400" fill="#fff"/>
  <text x="330" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">MQTT Scan Ingestion Sequence</text>

  <defs>
    <marker id="a" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#374151"/></marker>
    <marker id="ar" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#b91c1c"/></marker>
    <marker id="ag" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#15803d"/></marker>
  </defs>

  <!-- Participants -->
  <rect x="30"  y="44" width="110" height="30" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="85"  y="63" text-anchor="middle" fill="#1e3a8a" font-weight="bold" font-size="11">Firmware</text>

  <rect x="190" y="44" width="110" height="30" rx="4" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="245" y="63" text-anchor="middle" fill="#1e1b4b" font-weight="bold" font-size="11">MQTT Broker</text>

  <rect x="350" y="44" width="110" height="30" rx="4" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="405" y="63" text-anchor="middle" fill="#1e1b4b" font-weight="bold" font-size="11">Scan Handler</text>

  <rect x="510" y="44" width="120" height="30" rx="4" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
  <text x="570" y="58" text-anchor="middle" fill="#78350f" font-weight="bold" font-size="11">PostgreSQL</text>
  <text x="570" y="70" text-anchor="middle" fill="#78350f" font-size="9">raw_scans</text>

  <!-- Lifelines -->
  <line x1="85"  y1="74" x2="85"  y2="380" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="245" y1="74" x2="245" y2="380" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="405" y1="74" x2="405" y2="380" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="570" y1="74" x2="570" y2="380" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- 1. Batch accumulator flushes (self-activation) -->
  <rect x="50" y="96" width="70" height="20" rx="2" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
  <text x="85" y="110" text-anchor="middle" font-size="9" fill="#1e3a8a">batch flush (150 ms)</text>

  <!-- 2. PUBLISH JSON array -->
  <line x1="85" y1="130" x2="235" y2="130" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="165" y="123" text-anchor="middle" font-size="10" fill="#374151" font-weight="bold">PUBLISH  QoS 1</text>
  <text x="165" y="136" text-anchor="middle" font-size="9" fill="#64748b">lighthouse/{id}/scans — JSON array</text>

  <!-- 3. PUBACK -->
  <line x1="235" y1="155" x2="95"  y2="155" stroke="#374151" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#a)"/>
  <text x="165" y="149" text-anchor="middle" font-size="9" fill="#64748b">PUBACK</text>

  <!-- 4. onPublish callback → Scan Handler -->
  <line x1="245" y1="178" x2="395" y2="178" stroke="#374151" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="320" y="171" text-anchor="middle" font-size="10" fill="#374151" font-weight="bold">onPublish callback</text>

  <!-- 5. Parse + validate loop note -->
  <rect x="370" y="196" width="160" height="48" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="450" y="211" text-anchor="middle" font-size="9" fill="#374151" font-weight="bold">for each element:</text>
  <text x="450" y="224" text-anchor="middle" font-size="9" fill="#374151">validate (epc, rssiDbm,</text>
  <text x="450" y="237" text-anchor="middle" font-size="9" fill="#374151">timestamp, timeBasis)</text>

  <!-- 6a. Valid → INSERT -->
  <line x1="405" y1="244" x2="405" y2="268" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="415" y="260" font-size="9" fill="#15803d">valid</text>
  <line x1="405" y1="268" x2="560" y2="268" stroke="#374151" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="483" y="261" text-anchor="middle" font-size="10" fill="#374151" font-weight="bold">INSERT raw_scan</text>
  <text x="483" y="274" text-anchor="middle" font-size="9" fill="#64748b">processedAt = null</text>

  <!-- 6b. Invalid → discard (note) -->
  <text x="375" y="300" font-size="9" fill="#b91c1c">invalid → discarded silently</text>

  <!-- 7. WebSocket broadcast -->
  <line x1="405" y1="320" x2="235" y2="320" stroke="#374151" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a)"/>
  <text x="320" y="313" text-anchor="middle" font-size="10" fill="#374151" font-weight="bold">WS broadcast  scan event</text>
  <text x="320" y="326" text-anchor="middle" font-size="9" fill="#64748b">to all connected dashboard clients</text>

  <!-- Footer note -->
  <rect x="30" y="352" width="600" height="24" rx="3" fill="#f1f5f9" stroke="#d1d5db" stroke-width="1"/>
  <text x="330" y="368" text-anchor="middle" font-size="10" fill="#475569">timeBasis (synced / estimated / relative) is stored verbatim and evaluated at cluster processing time, not here</text>

</svg>
