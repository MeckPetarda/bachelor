<svg viewBox="0 0 580 560" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif" font-size="12">
  <rect width="580" height="560" fill="#fff"/>
  <text x="290" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Event Sweeper Cycle</text>

  <defs>
    <marker id="a" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#374151"/></marker>
    <marker id="ar" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#b91c1c"/></marker>
    <marker id="ag" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#15803d"/></marker>
  </defs>

  <!-- Timer tick -->
  <rect x="195" y="44" width="190" height="32" rx="16" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="290" y="64" text-anchor="middle" fill="#fff" font-weight="bold">Timer tick (every 2 s)</text>
  <line x1="290" y1="76" x2="290" y2="98" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Previous cycle running? -->
  <polygon points="290,98 370,126 290,154 210,126" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
  <text x="290" y="120" text-anchor="middle" fill="#78350f" font-weight="bold" font-size="11">Previous</text>
  <text x="290" y="136" text-anchor="middle" fill="#78350f" font-weight="bold" font-size="11">cycle running?</text>

  <!-- YES → skip -->
  <line x1="370" y1="126" x2="440" y2="126" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="403" y="119" text-anchor="middle" font-size="10" fill="#b91c1c">Yes</text>
  <rect x="440" y="112" width="80" height="28" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="480" y="130" text-anchor="middle" fill="#7f1d1d" font-size="11" font-weight="bold">Skip tick</text>

  <!-- NO → query -->
  <line x1="290" y1="154" x2="290" y2="176" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="300" y="169" font-size="10" fill="#374151">No</text>

  <!-- Query closed clusters -->
  <rect x="175" y="176" width="230" height="52" rx="4" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="290" y="194" text-anchor="middle" fill="#0c4a6e" font-weight="bold">Query closed clusters</text>
  <text x="290" y="209" text-anchor="middle" fill="#0c4a6e" font-size="9">MAX(timestamp) &lt; NOW() − activityTimeoutMs</text>
  <text x="290" y="222" text-anchor="middle" fill="#0c4a6e" font-size="9">group by (epc, groupId) · max 50 per cycle</text>
  <line x1="290" y1="228" x2="290" y2="250" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Clusters found? -->
  <polygon points="290,250 370,274 290,298 210,274" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
  <text x="290" y="268" text-anchor="middle" fill="#78350f" font-weight="bold" font-size="11">Clusters</text>
  <text x="290" y="284" text-anchor="middle" fill="#78350f" font-weight="bold" font-size="11">found?</text>

  <!-- NO → done -->
  <line x1="210" y1="274" x2="130" y2="274" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="172" y="267" text-anchor="middle" font-size="10" fill="#374151">No</text>
  <rect x="50" y="260" width="80" height="28" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="90" y="278" text-anchor="middle" font-size="11" fill="#475569">Cycle ends</text>

  <!-- YES → processCluster -->
  <line x1="290" y1="298" x2="290" y2="320" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="300" y="313" font-size="10" fill="#374151">Yes</text>

  <!-- processCluster -->
  <rect x="185" y="320" width="210" height="38" rx="4" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="290" y="338" text-anchor="middle" fill="#0c4a6e" font-weight="bold">processCluster()</text>
  <text x="290" y="351" text-anchor="middle" fill="#0c4a6e" font-size="9">fetch scans · run both algorithms</text>
  <line x1="290" y1="358" x2="290" y2="380" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Success? -->
  <polygon points="290,380 360,404 290,428 220,404" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
  <text x="290" y="398" text-anchor="middle" fill="#78350f" font-weight="bold" font-size="11">Success?</text>
  <text x="290" y="413" text-anchor="middle" fill="#78350f" font-size="10">(synced timeBasis)</text>

  <!-- YES → mark processedAt -->
  <line x1="290" y1="428" x2="290" y2="450" stroke="#15803d" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="300" y="443" font-size="10" fill="#15803d">Yes</text>
  <rect x="175" y="450" width="230" height="38" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="290" y="468" text-anchor="middle" fill="#14532d" font-weight="bold">Mark processedAt</text>
  <text x="290" y="481" text-anchor="middle" fill="#14532d" font-size="9">Insert processed_events (both algorithms)</text>

  <!-- NO → orphan -->
  <line x1="360" y1="404" x2="430" y2="404" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="393" y="397" text-anchor="middle" font-size="10" fill="#b91c1c">No</text>
  <rect x="430" y="384" width="130" height="44" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="495" y="402" text-anchor="middle" fill="#7f1d1d" font-weight="bold" font-size="11">Orphan scans</text>
  <text x="495" y="415" text-anchor="middle" fill="#7f1d1d" font-size="9">orphanedAt + orphanReason</text>
  <text x="495" y="426" text-anchor="middle" fill="#7f1d1d" font-size="9">unsyncable / insufficient_data</text>

  <!-- Loop back: next cluster -->
  <line x1="290" y1="488" x2="290" y2="508" stroke="#374151" stroke-width="1.5"/>
  <line x1="290" y1="508" x2="155" y2="508" stroke="#374151" stroke-width="1.5"/>
  <line x1="155" y1="508" x2="155" y2="336" stroke="#374151" stroke-width="1.5"/>
  <line x1="155" y1="336" x2="185" y2="336" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="135" y="432" text-anchor="middle" font-size="10" fill="#374151" transform="rotate(-90,135,432)">next cluster</text>

</svg>
