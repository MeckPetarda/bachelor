<svg viewBox="0 0 720 500" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif" font-size="12">
  <rect width="720" height="500" fill="#fff"/>
  <text x="360" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Offline Caching and Replay Sequence</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#374151"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#b91c1c"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#15803d"/>
    </marker>
  </defs>

  <!-- Participants -->
  <!-- RFID / Tag -->
  <rect x="30" y="45" width="100" height="30" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="80" y="65" text-anchor="middle" fill="#1e3a8a" font-weight="bold" font-size="11">RFID / Tag</text>
  <!-- Firmware -->
  <rect x="190" y="45" width="100" height="30" rx="4" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="240" y="65" text-anchor="middle" fill="#1e1b4b" font-weight="bold" font-size="11">Firmware</text>
  <!-- LittleFS -->
  <rect x="350" y="45" width="100" height="30" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="400" y="65" text-anchor="middle" fill="#78350f" font-weight="bold" font-size="11">LittleFS</text>
  <!-- MQTT Broker -->
  <rect x="510" y="45" width="120" height="30" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="570" y="65" text-anchor="middle" fill="#14532d" font-weight="bold" font-size="11">MQTT Broker</text>

  <!-- Lifelines -->
  <line x1="80" y1="75" x2="80" y2="490" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="240" y1="75" x2="240" y2="490" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="400" y1="75" x2="400" y2="490" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="570" y1="75" x2="570" y2="490" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ── OFFLINE PHASE ── -->
  <rect x="30" y="95" width="660" height="18" rx="3" fill="#fee2e2" fill-opacity="0.4"/>
  <text x="360" y="108" text-anchor="middle" font-size="11" fill="#b91c1c" font-style="italic">MQTT offline — connection lost</text>

  <!-- 1. Tag detected -->
  <line x1="80" y1="130" x2="230" y2="130" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="155" y="124" text-anchor="middle" font-size="10" fill="#374151">tag detection (EPC, RSSI, timestamp)</text>

  <!-- 2. MQTT publish fails -->
  <line x1="240" y1="155" x2="560" y2="155" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrR)"/>
  <text x="400" y="149" text-anchor="middle" font-size="10" fill="#b91c1c">MQTT publish — FAILED (offline)</text>
  <!-- X mark -->
  <text x="565" y="160" font-size="14" fill="#b91c1c" font-weight="bold">✕</text>

  <!-- 3. Write to LittleFS -->
  <line x1="240" y1="180" x2="390" y2="180" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="315" y="174" text-anchor="middle" font-size="10" fill="#d97706">write event to ring buffer</text>

  <!-- 4. NVS pointer update -->
  <line x1="400" y1="205" x2="250" y2="205" stroke="#d97706" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrR)"/>
  <text x="325" y="199" text-anchor="middle" font-size="10" fill="#d97706">NVS read/write pointer updated</text>

  <!-- More events (collapsed) -->
  <text x="360" y="230" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">[ additional events accumulate in ring buffer ... ]</text>

  <!-- ── RECONNECT PHASE ── -->
  <rect x="30" y="248" width="660" height="18" rx="3" fill="#dcfce7" fill-opacity="0.4"/>
  <text x="360" y="261" text-anchor="middle" font-size="11" fill="#15803d" font-style="italic">MQTT reconnects</text>

  <!-- 5. MQTT reconnected -->
  <line x1="240" y1="283" x2="560" y2="283" stroke="#15803d" stroke-width="1.5" marker-end="url(#arrG)"/>
  <text x="400" y="277" text-anchor="middle" font-size="10" fill="#15803d">MQTT connected</text>

  <!-- 6. Replay task starts -->
  <rect x="195" y="298" width="90" height="22" rx="3" fill="#e0e7ff" stroke="#4338ca" stroke-width="1"/>
  <text x="240" y="313" text-anchor="middle" font-size="10" fill="#1e1b4b">replay task starts</text>

  <!-- 7. Read from LittleFS -->
  <line x1="240" y1="335" x2="390" y2="335" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="315" y="329" text-anchor="middle" font-size="10" fill="#d97706">read event from ring buffer</text>

  <line x1="400" y1="355" x2="250" y2="355" stroke="#d97706" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrR)"/>
  <text x="325" y="349" text-anchor="middle" font-size="10" fill="#d97706">event payload</text>

  <!-- 8. Publish with offline flag -->
  <line x1="240" y1="378" x2="560" y2="378" stroke="#15803d" stroke-width="1.5" marker-end="url(#arrG)"/>
  <text x="400" y="372" text-anchor="middle" font-size="10" fill="#15803d">publish QoS 2 — offline:true, replayTime</text>

  <!-- 9. ACK -->
  <line x1="560" y1="400" x2="250" y2="400" stroke="#15803d" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrG)"/>
  <text x="400" y="394" text-anchor="middle" font-size="10" fill="#15803d">PUBACK / PUBCOMP (QoS 2 handshake)</text>

  <!-- 10. Advance ring buffer pointer -->
  <line x1="240" y1="422" x2="390" y2="422" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="315" y="416" text-anchor="middle" font-size="10" fill="#d97706">advance read pointer (NVS)</text>

  <!-- More events -->
  <text x="360" y="448" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">[ repeats at max 10 events/s until buffer empty ]</text>

  <!-- Rate limit note -->
  <rect x="30" y="462" width="660" height="22" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="360" y="477" text-anchor="middle" font-size="10" fill="#475569">Replay task runs at lower priority than real-time scan logging — live detections are never delayed by replay</text>

</svg>
