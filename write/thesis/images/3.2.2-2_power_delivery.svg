<svg viewBox="0 0 820 420" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif" font-size="12">
  <rect width="820" height="420" fill="#fff"/>
  <text x="410" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Power Delivery Architecture — Board v2</text>

  <defs>
    <marker id="a" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#374151"/></marker>
    <marker id="ab" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#1d4ed8"/></marker>
    <marker id="ao" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#b45309"/></marker>
    <marker id="ag" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#15803d"/></marker>
    <marker id="ap" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#7c3aed"/></marker>
  </defs>

  <!-- ── USB-C input ── -->
  <rect x="20" y="55" width="80" height="48" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="60" y="73" text-anchor="middle" fill="#1e3a8a" font-weight="bold" font-size="10">USB-C (J3)</text>
  <text x="60" y="86" text-anchor="middle" fill="#1e3a8a" font-size="9">VBUS 5 V</text>
  <text x="60" y="98" text-anchor="middle" fill="#64748b" font-size="8">CC1/CC2 R32/R33 5k1↓</text>
  <line x1="100" y1="79" x2="122" y2="79" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ab)"/>

  <!-- F1 fuse -->
  <rect x="122" y="67" width="56" height="24" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="150" y="78" text-anchor="middle" fill="#374151" font-size="10" font-weight="bold">F1</text>
  <text x="150" y="89" text-anchor="middle" fill="#64748b" font-size="8">SF-1206SP100-2</text>
  <line x1="178" y1="79" x2="200" y2="79" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ab)"/>

  <!-- DPDT SW2 -->
  <rect x="200" y="48" width="72" height="85" rx="4" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="236" y="66" text-anchor="middle" fill="#374151" font-weight="bold" font-size="11">SW2</text>
  <text x="236" y="79" text-anchor="middle" fill="#374151" font-size="9">DPDT switch</text>
  <line x1="200" y1="92" x2="215" y2="92" stroke="#94a3b8" stroke-width="1"/>
  <text x="236" y="96" text-anchor="middle" fill="#64748b" font-size="8">SW2A USB path</text>
  <text x="236" y="108" text-anchor="middle" fill="#64748b" font-size="8">SW2B boost path</text>
  <text x="236" y="120" text-anchor="middle" fill="#64748b" font-size="8">(ganged)</text>

  <!-- SW2A out top → D16 → +5V -->
  <line x1="272" y1="72" x2="312" y2="72" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ab)"/>
  <!-- D16 -->
  <polygon points="312,62 342,72 312,82" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/>
  <line x1="342" y1="72" x2="440" y2="72" stroke="#1d4ed8" stroke-width="2"/>
  <text x="327" y="57" text-anchor="middle" font-size="9" fill="#4338ca">D16 SS24A</text>

  <!-- USB also charges battery via TP4056: dashed line down from SW2A -->
  <line x1="236" y1="133" x2="236" y2="155" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ab)"/>
  <text x="255" y="148" font-size="8" fill="#1d4ed8">VIN</text>

  <!-- ── Li-ion cell ── -->
  <rect x="20" y="250" width="80" height="38" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="60" y="267" text-anchor="middle" fill="#78350f" font-weight="bold" font-size="10">Li-ion Cell</text>
  <text x="60" y="281" text-anchor="middle" fill="#78350f" font-size="9">3.2 – 4.2 V</text>

  <!-- ── Charger submodule ── -->
  <rect x="130" y="155" width="150" height="140" rx="4" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="205" y="172" text-anchor="middle" fill="#78350f" font-weight="bold" font-size="10">Charger submodule</text>
  <line x1="130" y1="180" x2="280" y2="180" stroke="#d97706" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="205" y="194" text-anchor="middle" fill="#78350f" font-size="9">TP4056</text>
  <text x="205" y="206" text-anchor="middle" fill="#64748b" font-size="8">Li-ion charge controller</text>
  <line x1="130" y1="215" x2="280" y2="215" stroke="#d97706" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="205" y="229" text-anchor="middle" fill="#78350f" font-size="9">DW01HA + FS8205A</text>
  <text x="205" y="242" text-anchor="middle" fill="#64748b" font-size="8">overcharge / discharge protection</text>
  <text x="205" y="254" text-anchor="middle" fill="#64748b" font-size="8">dual-MOSFET switch</text>
  <line x1="130" y1="262" x2="280" y2="262" stroke="#d97706" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="205" y="278" text-anchor="middle" fill="#78350f" font-size="9">+OUT (protected)</text>

  <!-- USB → charger VIN -->
  <!-- already drawn above -->

  <!-- Cell ↔ charger BAT terminals -->
  <line x1="100" y1="269" x2="130" y2="269" stroke="#b45309" stroke-width="2" marker-end="url(#ao)"/>
  <line x1="130" y1="285" x2="100" y2="285" stroke="#b45309" stroke-width="1.5" marker-end="url(#ao)"/>
  <text x="115" y="265" text-anchor="middle" font-size="8" fill="#b45309">+BAT</text>
  <text x="115" y="298" text-anchor="middle" font-size="8" fill="#b45309">-BAT</text>

  <!-- Charger +OUT → F2 -->
  <line x1="280" y1="278" x2="310" y2="278" stroke="#b45309" stroke-width="2" marker-end="url(#ao)"/>

  <!-- F2 fuse -->
  <rect x="310" y="266" width="56" height="24" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="338" y="277" text-anchor="middle" fill="#374151" font-size="10" font-weight="bold">F2</text>
  <text x="338" y="288" text-anchor="middle" fill="#64748b" font-size="8">SF-1206SP100-2</text>
  <line x1="366" y1="278" x2="386" y2="278" stroke="#b45309" stroke-width="2" marker-end="url(#ao)"/>

  <!-- SW2B (same switch box, lower connection) -->
  <!-- draw connection from SW2 lower to SX1308 -->
  <line x1="272" y1="118" x2="310" y2="118" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="310" y1="118" x2="310" y2="278" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="295" y="115" font-size="8" fill="#b45309" text-anchor="middle">SW2B</text>

  <!-- SX1308 Boost -->
  <rect x="386" y="260" width="110" height="44" rx="3" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
  <text x="441" y="277" text-anchor="middle" fill="#7c2d12" font-weight="bold" font-size="10">SX1308 Boost</text>
  <text x="441" y="289" text-anchor="middle" fill="#64748b" font-size="9">3.2–4.2 V → 5 V</text>
  <text x="441" y="300" text-anchor="middle" fill="#64748b" font-size="8">L1 4.7 µH · D7 SS24A · C4 22 µF</text>

  <line x1="496" y1="278" x2="520" y2="278" stroke="#b45309" stroke-width="2" marker-end="url(#ao)"/>

  <!-- D15 SS24A -->
  <polygon points="520,268 550,278 520,288" fill="#fed7aa" stroke="#b45309" stroke-width="1.5"/>
  <line x1="550" y1="278" x2="580" y2="278" stroke="#b45309" stroke-width="2"/>
  <text x="534" y="256" text-anchor="middle" font-size="9" fill="#b45309">D15 SS24A</text>

  <!-- OR junction: both paths → +5V -->
  <!-- D16 ends at x=440, y=72; D15 ends at x=580, y=278 -->
  <!-- Join at x=580 -->
  <line x1="440" y1="72" x2="580" y2="72" stroke="#374151" stroke-width="2"/>
  <line x1="580" y1="72" x2="580" y2="278" stroke="#374151" stroke-width="2"/>
  <circle cx="580" cy="175" r="4" fill="#374151"/>
  <line x1="580" y1="175" x2="620" y2="175" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <text x="545" y="165" font-size="9" fill="#475569" font-style="italic">diode OR</text>

  <!-- +5V rail -->
  <rect x="620" y="161" width="80" height="30" rx="4" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="660" y="178" text-anchor="middle" fill="#14532d" font-weight="bold" font-size="11">+5 V rail</text>
  <text x="660" y="155" text-anchor="middle" font-size="8" fill="#64748b">C17: 1000 µF bulk</text>

  <!-- +5V → TS1117B LDO -->
  <line x1="700" y1="176" x2="730" y2="176" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>

  <!-- TS1117B -->
  <rect x="730" y="162" width="70" height="30" rx="3" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="765" y="176" text-anchor="middle" fill="#14532d" font-weight="bold" font-size="10">TS1117B LDO</text>
  <text x="765" y="188" text-anchor="middle" fill="#64748b" font-size="8">5 V → 3.3 V</text>

  <!-- LDO → +3.3V rail -->
  <line x1="765" y1="162" x2="765" y2="130" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <rect x="720" y="105" width="90" height="25" rx="4" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="765" y="122" text-anchor="middle" fill="#14532d" font-weight="bold" font-size="11">+3.3 V rail</text>
  <text x="765" y="99" text-anchor="middle" fill="#64748b" font-size="8">C16 100 µF · C12/C14 10 µF</text>

  <!-- +5V → BC337 RFID switch -->
  <line x1="660" y1="191" x2="660" y2="340" stroke="#374151" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="660" y1="340" x2="700" y2="340" stroke="#374151" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a)"/>

  <!-- BC337 switch -->
  <rect x="700" y="322" width="100" height="48" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="750" y="337" text-anchor="middle" fill="#374151" font-weight="bold" font-size="10">Q1 BC337</text>
  <text x="750" y="350" text-anchor="middle" fill="#374151" font-size="9">RFID power gate</text>
  <text x="750" y="363" text-anchor="middle" fill="#64748b" font-size="8">R4 150 Ω base resistor</text>

  <!-- ESP32 → BC337 base -->
  <line x1="570" y1="346" x2="700" y2="346" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#ap)"/>
  <text x="635" y="340" text-anchor="middle" font-size="9" fill="#7c3aed">RFID_PW (ESP32 IO25)</text>

  <!-- BC337 → R300 VCC -->
  <line x1="800" y1="346" x2="815" y2="346" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="816" y="343" font-size="9" fill="#374151">→ R300 VCC</text>

  <!-- ADC monitoring -->
  <rect x="20" y="330" width="180" height="40" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="110" y="346" text-anchor="middle" font-size="9" fill="#374151" font-weight="bold">ADC monitoring (ESP32)</text>
  <text x="110" y="358" text-anchor="middle" font-size="8" fill="#475569">ADS_BAT: R35/R36 divider → IO35</text>
  <text x="110" y="368" text-anchor="middle" font-size="8" fill="#475569">USB_SENSE: R37/R38 divider → IO32</text>

</svg>
