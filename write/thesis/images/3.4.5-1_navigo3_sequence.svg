<svg viewBox="0 0 740 500" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif" font-size="12">
  <rect width="740" height="500" fill="#fff"/>
  <text x="370" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Navigo3 Integration — Push and Retry Sequence</text>

  <defs>
    <marker id="a" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#374151"/></marker>
    <marker id="ag" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#15803d"/></marker>
    <marker id="ar" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#b91c1c"/></marker>
    <marker id="ao" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#d97706"/></marker>
  </defs>

  <!-- Participants -->
  <rect x="20"  y="44" width="130" height="30" rx="4" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="85"  y="63" text-anchor="middle" fill="#1e1b4b" font-weight="bold" font-size="11">Event Sweeper</text>

  <rect x="200" y="44" width="130" height="30" rx="4" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
  <text x="265" y="63" text-anchor="middle" fill="#78350f" font-weight="bold" font-size="11">PostgreSQL</text>

  <rect x="380" y="44" width="150" height="30" rx="4" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="455" y="63" text-anchor="middle" fill="#1e1b4b" font-weight="bold" font-size="11">Navigo3 Connector</text>

  <rect x="580" y="44" width="140" height="30" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="650" y="63" text-anchor="middle" fill="#78350f" font-weight="bold" font-size="11">Navigo3 REST API</text>

  <!-- Lifelines -->
  <line x1="85"  y1="74" x2="85"  y2="480" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="265" y1="74" x2="265" y2="480" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="455" y1="74" x2="455" y2="480" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="650" y1="74" x2="650" y2="480" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ── IMMEDIATE PUSH ── -->
  <rect x="20" y="90" width="700" height="16" rx="2" fill="#e0f2fe" fill-opacity="0.5"/>
  <text x="370" y="102" text-anchor="middle" font-size="10" fill="#0369a1" font-style="italic">Immediate push — on each new processed_event</text>

  <!-- 1. New event + eligibility check -->
  <rect x="50" y="114" width="70" height="20" rx="2" fill="#e0e7ff" stroke="#4338ca" stroke-width="1"/>
  <text x="85" y="128" text-anchor="middle" font-size="9" fill="#1e1b4b">event created</text>

  <line x1="85" y1="148" x2="255" y2="148" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="170" y="141" text-anchor="middle" font-size="10" fill="#374151" font-weight="bold">eligibility check</text>
  <text x="170" y="155" text-anchor="middle" font-size="9" fill="#64748b">algorithmId · direction in/out · syncId present</text>

  <!-- 2. Query counterpart -->
  <line x1="265" y1="175" x2="95" y2="175" stroke="#374151" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#a)"/>
  <text x="180" y="168" text-anchor="middle" font-size="9" fill="#374151">query counterpart (same user, opposite dir, same day)</text>

  <!-- 3a. Counterpart found → pushPair → upsert -->
  <text x="85" y="200" text-anchor="start" font-size="10" fill="#374151">  if counterpart found:</text>
  <line x1="85" y1="213" x2="445" y2="213" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="265" y="206" text-anchor="middle" font-size="10" fill="#374151" font-weight="bold">pushPair()</text>
  <line x1="455" y1="228" x2="640" y2="228" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="548" y="221" text-anchor="middle" font-size="10" fill="#374151">POST …/upsert</text>
  <line x1="640" y1="244" x2="465" y2="244" stroke="#15803d" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#ag)"/>
  <text x="553" y="238" text-anchor="middle" font-size="9" fill="#15803d">200 OK → both events synced = true</text>

  <!-- 3b. No counterpart → pushEvent -->
  <text x="85" y="272" text-anchor="start" font-size="10" fill="#374151">  if no counterpart:</text>
  <line x1="85" y1="285" x2="445" y2="285" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="265" y="278" text-anchor="middle" font-size="10" fill="#374151" font-weight="bold">pushEvent()</text>
  <line x1="455" y1="300" x2="640" y2="300" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="548" y="293" text-anchor="middle" font-size="10" fill="#374151">POST …/start or …/stop</text>

  <!-- failure branch -->
  <line x1="640" y1="316" x2="465" y2="316" stroke="#b91c1c" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#ar)"/>
  <text x="553" y="310" text-anchor="middle" font-size="9" fill="#b91c1c">fail → syncedToIntegration left false</text>

  <!-- ── RETRY SWEEP ── -->
  <rect x="20" y="338" width="700" height="16" rx="2" fill="#fef3c7" fill-opacity="0.5"/>
  <text x="370" y="350" text-anchor="middle" font-size="10" fill="#d97706" font-style="italic">Retry sweep — Navigo3 Poller, every 60 s</text>

  <!-- 4. Fetch unsynced -->
  <line x1="455" y1="368" x2="275" y2="368" stroke="#d97706" stroke-width="1.5" marker-end="url(#ao)"/>
  <text x="365" y="361" text-anchor="middle" font-size="10" fill="#d97706" font-weight="bold">fetch up to 100 unsynced eligible events</text>

  <!-- 5. Retry push (same logic as above) -->
  <line x1="265" y1="385" x2="95" y2="385" stroke="#d97706" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#ao)"/>
  <text x="180" y="379" text-anchor="middle" font-size="9" fill="#d97706">events payload</text>

  <line x1="85" y1="402" x2="445" y2="402" stroke="#d97706" stroke-width="1.5" marker-end="url(#ao)"/>
  <text x="265" y="395" text-anchor="middle" font-size="10" fill="#d97706" font-weight="bold">pushPair() or pushEvent() per event</text>

  <line x1="455" y1="418" x2="640" y2="418" stroke="#d97706" stroke-width="1.5" marker-end="url(#ao)"/>
  <text x="548" y="411" text-anchor="middle" font-size="10" fill="#d97706">POST to Navigo3</text>

  <!-- Footer note -->
  <rect x="20" y="446" width="700" height="22" rx="3" fill="#f1f5f9" stroke="#d1d5db" stroke-width="1"/>
  <text x="370" y="461" text-anchor="middle" font-size="10" fill="#475569">Retry sweep is non-blocking: skips cycle if previous sweep is still running</text>

</svg>
